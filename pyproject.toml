[project]
name = "iflow-mcp_batteryshark_agent_construct"
version = "0.1.0"
description = "Agent Construct - A Model Context Protocol (MCP) server implementation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "batteryshark", email = "batteryshark@example.com"}
]
dependencies = [
    "fastapi>=0.68.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "sse-starlette>=2.2.1,<3.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "google-generativeai>=0.3.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "mcpadapt>=0.0.15,<1.0.0",
    "markdownify>=0.11.6,<1.0.0",
    "playwright>=1.40.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "urllib3>=2.0.0,<3.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pyyaml>=6.0,<7.0.0",
]

[project.scripts]
agent-construct = "mcp_server:main"
agent-construct-stdio = "mcp_server.stdio_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "tools", "config"]